<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="Ha.png" type="image/x-icon">
    <title>Happy Birthday Pawan 💖</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #000033, #000066);
            overflow: hidden;
            position: relative;
            font-family: Arial, sans-serif;
        }

        /* HEADER */
        header {
            width: 100%;
            padding: 12px 0;
            background: #0B1F8C;
            color: white;
            text-align: center;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
            font-weight: bold;
            font-size: 21px;
        }

        header span:last-child {
            font-size: 28px;
        }

        /* STARS */
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px white;
            animation: twinkle 2s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.8;
            }

            50% {
                opacity: 0.2;
            }
        }

        /* BALLOON */
        #balloon {
            width: 200px;
            height: 240px;
            background: radial-gradient(
                circle at 50% 25%,
                #FF6B6B,
                #FF0000
            );

            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
            cursor: pointer;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);

            animation: float 3s ease-in-out infinite;
        }

        #balloon:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(255, 0, 0, 0.7);
        }

        /* BALLOON STRING */
        #balloon::after {
            content: "";
            width: 4px;
            height: 100px;
            background-color: white;

            position: absolute;
            bottom: -100px;
            left: 50%;

            transform: translateX(-50%);
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        /* BIRTHDAY MESSAGE */
        #birthday-text {
            display: none;

            font-size: 48px;
            font-weight: bold;
            color: white;

            text-align: center;

            position: absolute;
            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            z-index: 15;

            animation: fadeIn 1.5s ease-in-out;

            width: 90%;
            max-width: 800px;
        }

        .birthday-title {
            font-size: 48px;
            font-weight: bold;

            background: linear-gradient(
                to right,
                #c2248d,
                #fee67b
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            background-clip: text;
        }

        .birthday-emojis {
            display: block;
            font-size: 65px;
            margin-top: 10px;
        }

        .birthday-message {
            font-size: 20px;
            line-height: 1.7;

            color: white;

            max-width: 650px;

            margin: 20px auto 0;

            padding: 0 20px;

            font-weight: normal;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translate(-50%, -45%);
            }

            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        /* CONFETTI */
        .confetti {
            position: absolute;

            width: 10px;
            height: 10px;

            opacity: 0;

            border-radius: 50%;

            z-index: 12;
        }

        /* FIREWORK */
        .firework {
            position: absolute;

            width: 4px;
            height: 80px;

            background: linear-gradient(
                to top,
                #ff007f,
                #ff0000
            );

            top: 100%;
            left: 50%;

            transform-origin: bottom;

            animation:
                shoot 0.8s ease-in forwards,
                explode 0.8s ease-in 0.8s forwards;

            z-index: 10;
        }

        @keyframes shoot {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-100vh);
            }
        }

        @keyframes explode {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            100% {
                transform: scale(3);
                opacity: 0;
            }
        }

        /* LOADING SPINNER */
        #spinner {
            position: absolute;

            top: 50%;
            left: 50%;

            width: 100px;
            height: 100px;

            border: 10px solid #f3f3f3;
            border-top: 10px solid #767676;

            border-radius: 50%;

            animation: spin 1s linear infinite;

            z-index: 30;
        }

        @keyframes spin {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }

            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* AUDIO */
        #audio-player {
            display: none;
        }

        /* BALLOON BLAST */
        .blast {
            position: absolute;

            border-radius: 50%;

            background: radial-gradient(
                circle,
                rgba(255, 0, 0, 1) 0%,
                rgba(255, 200, 0, 1) 50%,
                rgba(255, 255, 255, 0) 70%
            );

            opacity: 0;

            pointer-events: none;

            z-index: 25;
        }

        @keyframes blastAnimation {
            0% {
                width: 0;
                height: 0;
                opacity: 1;

                transform: translate(-50%, -50%);
            }

            100% {
                width: 300px;
                height: 300px;
                opacity: 0;

                transform: translate(-50%, -50%);
            }
        }

        /* FOOTER */
        footer {
            position: absolute;

            bottom: 15px;

            width: 100%;

            text-align: center;

            color: rgba(255, 255, 255, 0.8);

            font-size: 14px;

            letter-spacing: 0.5px;

            z-index: 20;
        }

        /* MOBILE */
        @media (max-width: 600px) {

            header {
                font-size: 17px;
                padding: 10px 0;
            }

            header span:last-child {
                font-size: 22px;
            }

            #balloon {
                width: 150px;
                height: 190px;
            }

            .birthday-title {
                font-size: 34px;
            }

            .birthday-emojis {
                font-size: 45px;
            }

            .birthday-message {
                font-size: 17px;
                line-height: 1.5;
            }

            footer {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>
        <span>Special Birthday Wishes</span>
        <br>
        <span>Click on Balloon 🎈</span>
    </header>


    <!-- LOADING -->
    <div id="spinner"></div>


    <!-- BALLOON -->
    <div id="balloon" style="display: none;"></div>


    <!-- BIRTHDAY MESSAGE -->
    <div id="birthday-text">

        <span class="birthday-title">
            Happy Birthday Pawan 💖!
        </span>

        <span class="birthday-emojis">
            ❣️🥳🎂💝🫶
        </span>

        <p class="birthday-message">
            Older? Yes.<br>
Wiser? Debatable. 😂 <br>
Special? Definitely. ❤️<br>
            <br>
            Have an amazing birthday! 🎂✨
        </p>

    </div>


    <!-- MUSIC -->
    <audio id="audio-player" src="ss.mp3"></audio>


    <!-- FOOTER -->
    <footer>
        Made with ❤️ just for Pawan
    </footer>


    <script>

        /* CREATE STARS */

        function createStars() {

            for (let i = 0; i < 100; i++) {

                const star = document.createElement("div");

                star.classList.add("star");

                star.style.left =
                    Math.random() * 100 + "vw";

                star.style.top =
                    Math.random() * 100 + "vh";

                star.style.animationDelay =
                    Math.random() * 2 + "s";

                document.body.appendChild(star);
            }
        }

        createStars();


        /* ELEMENTS */

        const balloon =
            document.getElementById("balloon");

        const birthdayText =
            document.getElementById("birthday-text");

        const audioPlayer =
            document.getElementById("audio-player");

        const spinner =
            document.getElementById("spinner");


        /* BALLOON CLICK */

        balloon.addEventListener("click", () => {

            /* Blast */

            createBlast(
                balloon.getBoundingClientRect()
            );


            /* Hide balloon */

            balloon.style.display = "none";


            /* Show birthday message */

            birthdayText.style.display = "block";


            /* Play music */

            audioPlayer.play().catch(error => {

                console.log(
                    "Audio could not autoplay:",
                    error
                );

            });


            /* Effects */

            createConfetti();

            createFireworks();

        });


        /* CONFETTI */

        function createConfetti() {

            const colors = [
                "#ff0",
                "#f0f",
                "#0ff",
                "#f00",
                "#0f0",
                "#00f"
            ];

            for (let i = 0; i < 100; i++) {

                const confetti =
                    document.createElement("div");

                confetti.classList.add("confetti");

                confetti.style.left =
                    Math.random() * 100 + "vw";

                confetti.style.top =
                    Math.random() * 50 + "vh";

                confetti.style.backgroundColor =
                    colors[
                        Math.floor(
                            Math.random() * colors.length
                        )
                    ];

                document.body.appendChild(confetti);

                animateConfetti(confetti);
            }
        }


        /* CONFETTI ANIMATION */

        function animateConfetti(confetti) {

            const duration =
                5000 + Math.random() * 5000;

            const animation =
                confetti.animate(

                    [
                        {
                            transform:
                                "translateY(0) rotate(0deg)",
                            opacity: 1
                        },

                        {
                            transform:
                                "translateY(1000px) rotate(720deg)",
                            opacity: 0
                        }
                    ],

                    {
                        duration: duration,
                        easing: "ease-out"
                    }
                );


            animation.onfinish = () => {

                confetti.remove();

            };
        }


        /* FIREWORKS */

        function createFireworks() {

            for (let i = 0; i < 15; i++) {

                const firework =
                    document.createElement("div");

                firework.classList.add("firework");

                firework.style.left =
                    Math.random() * 100 + "vw";

                firework.style.animationDelay =
                    i * 0.25 + "s";

                document.body.appendChild(firework);


                setTimeout(() => {

                    firework.remove();

                }, 4000);
            }
        }


        /* BALLOON BLAST */

        function createBlast(rect) {

            const blast =
                document.createElement("div");

            blast.classList.add("blast");

            blast.style.left =
                `${rect.left + rect.width / 2}px`;

            blast.style.top =
                `${rect.top + rect.height / 2}px`;

            document.body.appendChild(blast);


            blast.style.animation =
                "blastAnimation 0.5s forwards";


            setTimeout(() => {

                blast.remove();

            }, 500);
        }


        /* PAGE LOAD */

        window.onload = function () {

            setTimeout(() => {

                spinner.style.display = "none";

                balloon.style.display = "block";

            }, 1500);

        };

    </script>

</body>
</html>
